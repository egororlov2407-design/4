
name: Build Activity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project files
        run: |
          echo "Repository root:"
          pwd
          echo "Files:"
          ls -la
          test -f package.json || (echo "ERROR: package.json not found in repository root" && exit 1)
          test -f capacitor.config.json || test -f capacitor.config.ts || test -f capacitor.config.js || (echo "ERROR: Capacitor config not found in repository root" && exit 1)
          test -d www || (echo "ERROR: www directory not found in repository root" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['check:js'] ? 0 : 1)"; then
            npm run check:js
          elif [ -f scripts/check-js.cjs ]; then
            node scripts/check-js.cjs
          else
            echo "No JavaScript check script found; skipping."
          fi

      - name: Create Android project if needed
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Activity-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

