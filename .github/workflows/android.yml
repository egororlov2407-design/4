
name: Build Activity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Activity_3_1_Android_Source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Activity Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Activity source
        shell: bash
        run: |
          set -e

          ARCHIVE="Activity_3_1_Android_Source.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: $ARCHIVE not found"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ARCHIVE" -d source

          echo "Searching for package.json..."
          PACKAGE_FILE="$(find source -type f -name package.json -print -quit)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found in archive"
            find source -maxdepth 3 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Check JavaScript
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['check:js'] ? 0 : 1)"; then
            npm run check:js
          elif [ -f scripts/check-js.cjs ]; then
            node scripts/check-js.cjs
          else
            echo "No JavaScript check script found; skipping."
          fi

      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f android/gradlew ]; then
            echo "Android project and Gradle wrapper found."

          elif [ -d android ]; then
            echo "Android directory exists but Gradle wrapper is missing."
            ls -la android

            if [ -f android/build.gradle ] || \
               [ -f android/build.gradle.kts ] || \
               [ -f android/settings.gradle ] || \
               [ -f android/settings.gradle.kts ]; then
              echo "Existing native project detected."
              echo "Stopping to protect existing Android files."
              echo "Gradle wrapper must be restored separately."
              exit 1
            else
              echo "Incomplete Android directory detected."
              rm -rf android
              npx cap add android
            fi

          else
            echo "Creating Android project..."
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Activity-3.1-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
