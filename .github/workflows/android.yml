

name: Build Activity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Activity_3_1_Android_Source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Activity Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Activity source
        run: |
          if [ ! -f Activity_3_1_Android_Source.zip ]; then
            echo "ERROR: Activity_3_1_Android_Source.zip not found"
            exit 1
          fi

          mkdir -p source
          unzip -o Activity_3_1_Android_Source.zip -d source

          echo "Extracted files:"
          ls -la source

          if [ ! -f source/package.json ]; then
            echo "Searching for package.json..."
            find source -name package.json -print
          fi

          PROJECT_DIR="source"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            PROJECT_DIR="$(dirname "$(find source -name package.json -print -quit)")"
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json not found in archive"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Check JavaScript
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['check:js'] ? 0 : 1)"; then
            npm run check:js
          elif [ -f scripts/check-js.cjs ]; then
            node scripts/check-js.cjs
          else
            echo "No JavaScript check script found; skipping."
          fi

      - name: Create Android project if needed
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Activity-3.1-Android-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

